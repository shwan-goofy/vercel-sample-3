<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반응형 HTML 템플릿</title>
    <style>
        /* 기본 리셋 및 스타일 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
        }

        /* 상단 네비게이션 바 */
        header {
            background-color: #2c3e50;
            color: #fff;
            padding: 1rem;
            text-align: center;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 15px;
        }

        /* 메인 콘텐츠 레이아웃 */
        .container {
            display: flex;
            flex-wrap: wrap;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        main {
            flex: 3;
            min-width: 300px;
            padding: 15px;
        }
        aside {
            flex: 1;
            min-width: 200px;
            background-color: #f4f4f4;
            padding: 15px;
            margin-left: 20px;
        }

        /* 하단 푸터 */
        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 1.5rem;
            margin-top: 20px;
        }

        /* 모바일 화면 대응 (미디어 쿼리) */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            aside {
                margin-left: 0;
                margin-top: 20px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>나의 웹사이트</h1>
        <nav>
            <a href="#">홈</a>
            <a href="#">소개</a>
            <a href="#">연락처</a>
        </nav>
    </header>

    <div class="container">
        <main>
            <h2>메인 콘텐츠</h2>
            <p>이곳은 본문 내용이 들어가는 공간입니다. 화면 크기가 줄어들면 아래로 자연스럽게 이동합니다.</p>
        </main>
        <aside>
            <h2>사이드바</h2>
            <p>관련 링크, 공지사항, 광고 등의 보조 정보가 들어갑니다.</p>
        </aside>
    </div>

    <footer>
        <p>&copy; 2026 나의 웹사이트. All Rights Reserved.</p>
    </footer>

</body>
</html>
